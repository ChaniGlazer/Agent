<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Web Agent</title>
  <style>
    body {
      width: 360px;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #999;
      display: inline-block;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.connecting { background: #eab308; }
    .status-dot.disconnected, .status-dot.error { background: #ef4444; }
    .status-dot.unconfigured { background: #9ca3af; }
    #targetUrl {
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
      word-break: break-all;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 60px;
      resize: vertical;
      font-family: inherit;
      font-size: 12px;
      padding: 6px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }
    select {
      flex: 1;
      font-size: 12px;
      padding: 3px;
    }
    label.checkbox {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }
    button {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f7f7f7;
    }
    button.primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    button.danger {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      margin-top: 8px;
      height: 140px;
      overflow-y: auto;
      background: #0f172a;
      color: #d1d5db;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 4px;
    }
    #log .entry { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; }
    #log .info { color: #93c5fd; }
    #log .warn { color: #fbbf24; }
    #log .error { color: #f87171; }
    #log .success { color: #4ade80; }
    footer {
      margin-top: 8px;
      text-align: right;
    }
    footer a {
      font-size: 11px;
      color: #2563eb;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1><span id="statusDot" class="status-dot"></span><span id="statusText">Web Agent</span></h1>
  <div id="targetUrl">Not connected yet.</div>

  <textarea id="goal" placeholder="What should the agent do on this site? e.g. 'Fill the contact form with my details and submit it'"></textarea>

  <div class="row">
    <select id="approvalMode">
      <option value="none">No approval (autonomous)</option>
      <option value="each_action">Approve every action</option>
      <option value="final_only">Approve only the final action</option>
    </select>
    <label class="checkbox"><input type="checkbox" id="dryRun" /> Dry run</label>
  </div>

  <div class="buttons">
    <button id="startBtn" class="primary">Start task</button>
    <button id="stopBtn" class="danger" disabled>Stop</button>
  </div>

  <div id="log"></div>

  <footer><a id="optionsLink">Server settings</a></footer>

  <script src="popup.js"></script>
</body>
</html>
