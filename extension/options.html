<!doctype html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8" />
  <title>סוכן האינטרנט - הגדרות שרת</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      color: #1a1a1a;
    }
    h1 { font-size: 18px; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 13px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 4px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      direction: ltr;
      text-align: left;
    }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
    button {
      margin-top: 20px;
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    #saved { margin-right: 10px; font-size: 12px; color: #16a34a; visibility: hidden; }
  </style>
</head>
<body>
  <h1>סוכן האינטרנט - הגדרות שרת</h1>
  <p>חברו את הדפדפן הזה לשרת סוכן האינטרנט שלכם (למשל, שנפרס ב-Render).</p>

  <label for="serverUrl">כתובת שרת</label>
  <input id="serverUrl" type="text" placeholder="https://your-app.onrender.com" />
  <div class="hint">כתובת השרת שנפרס (בלי "/" בסוף).</div>

  <label for="token">טוקן אימות</label>
  <input id="token" type="password" placeholder="סוד משותף" />
  <div class="hint">חייב להתאים להגדרת AGENT_AUTH_TOKEN / auth_token בשרת.</div>

  <button id="saveBtn">שמור</button>
  <span id="saved">נשמר.</span>

  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
